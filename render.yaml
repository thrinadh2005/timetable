services:
  - type: web
    name: gmritdu-timetable-portal
    env: node
    plan: starter
    region: singapore
    buildCommand: npm ci --omit=dev --omit=optional
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_SSL
        value: true

services:
  timetable-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gmritdu-timetable:latest
    container_name: gmritdu-timetable-server
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - "JWT_SECRET=${JWT_SECRET:-gmritdu_production_secret_key_2026_autonomous}"
      - "DATABASE_URL=${DATABASE_URL:-}"
      - "DATABASE_SSL=${DATABASE_SSL:-true}"
      - "PG_ENGINE=${PG_ENGINE:-}"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
